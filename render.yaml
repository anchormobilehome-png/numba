services:
  - type: web
    name: numba
    runtime: node
    plan: starter            # use a paid plan: free plans sleep, which stops SMS collection and Paystack webhooks
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: numba-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: PROVIDER_API_KEY
        sync: false
databases:
  - name: numba-db
    plan: basic-256mb
