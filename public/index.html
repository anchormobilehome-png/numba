async function ping(){try{const r=await fetch("/health");LIVE=r.ok&&(await r.json()).ok===true}catch(e){LIVE=false}return LIVE}

function spin(){const ev=window.event,t=ev&&ev.target;let b=ev&&(ev.submitter||(t&&t.closest&&t.closest("button"))||(t&&t.tagName=="FORM"&&t.querySelector('button[type=submit],button:not([type])')));

 const slow=setTimeout(()=>toast("Waking up the server, almost there…"),6000);
 return()=>{clearTimeout(slow);if(window.__redirecting||!b.isConnected)return;b.disabled=false;b.classList.remove("ld");const s=b.querySelector(".sp");s&&s.remove()}}
